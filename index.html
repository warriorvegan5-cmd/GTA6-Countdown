
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTA 6 Live Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="countdown-screen">
    <div class="eyebrow">THE WAIT IS ALMOST OVER</div>

    <h1>GTA <span>VI</span></h1>
    <h2>LIVE RELEASE COUNTDOWN</h2>

    <section class="timer">
      <div class="time-box">
        <strong id="days">00</strong>
        <small>DAYS</small>
      </div>
      <div class="time-box">
        <strong id="hours">00</strong>
        <small>HOURS</small>
      </div>
      <div class="time-box">
        <strong id="minutes">00</strong>
        <small>MINUTES</small>
      </div>
      <div class="time-box">
        <strong id="seconds">00</strong>
        <small>SECONDS</small>
      </div>
    </section>

    <p class="release">NOVEMBER 19, 2026</p>
    <p class="community">JOIN THE WAITING ROOM • SUBSCRIBE • LIVE CHAT</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
